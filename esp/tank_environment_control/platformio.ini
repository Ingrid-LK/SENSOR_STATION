[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200 ; set baudrate to anything other than 9600
;upload_speed = 115200 ; instead of default speed of 460800
lib_deps=
  ; owner-based declaration
    knolleary/PubSubClient@^2.8
;    ESP Async WebServer  ;dont actually know why i got this
    bblanchon/ArduinoJson@^7.4.3
   

